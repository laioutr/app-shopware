name: release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm OIDC trusted publishing (tokenless publish + provenance).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Persisted for the release branch push, so it carries the same identity as the
          # PR the action opens with this token.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install

      # `prepack` builds the module against ./.nuxt/tsconfig.json, generated here.
      - name: Prepare
        run: pnpm run dev:prepare

      # Opens/updates a "Version Packages" PR while changesets are pending.
      # When that PR is merged, runs `pnpm release` to build + publish to npmjs.org.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: 'chore: release'
          commit: 'chore: release'
          createGithubReleases: true
        env:
          # A PR opened with the default GITHUB_TOKEN cannot trigger further workflows, so
          # release PRs would never get CI. This token gives them a different identity.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
