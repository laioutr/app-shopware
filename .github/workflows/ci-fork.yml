name: ci (fork)

# A fork PR receives no secrets under `pull_request`, leaving the private registry unreachable.
# pull_request_target runs in base-repo context, where the token exists, and takes its workflow
# definition from main rather than from the fork. These jobs still execute fork code with that
# token in scope, so the fork-ci environment holds every run until a maintainer has read the diff.
on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-fork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: fork-ci

    steps:
      - uses: actions/checkout@v5
        with:
          # Pin the commit that was approved; the PR branch can move after a maintainer signs off.
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the run's token out of .git/config, where checked-out fork code could read it.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # A restored pnpm store carries the private @laioutr-core packages, and any fork PR run
          # may read caches from the base branch. A cold install costs about six seconds.
          package-manager-cache: false

      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install

      # tsconfig.json extends ./.nuxt/tsconfig.json, which this generates. Without it the
      # import resolver cannot read any path and every import reports as unresolved.
      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

  test:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: fork-ci

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Playground prepare
        run: pnpm run dev:prepare

      - name: Test
        run: pnpm run test
